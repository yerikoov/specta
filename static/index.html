<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Specta — проверка ТЗ командой агентов</title>
  <meta name="description" content="Команда ИИ-агентов проверяет техническое задание финтех-проекта и задаёт уточняющие вопросы.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Nunito:wght@600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/landing.css">
  <link rel="stylesheet" href="/static/css/chain.css">
  <link rel="stylesheet" href="/static/css/chat.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%2331c943'/%3E%3C/svg%3E">
</head>
<body>
  <!-- SCREEN 1: LANDING -->
  <div id="landing" class="screen is-active">
    <header class="nav">
      <div class="nav-inner">
        <a class="nav__brand" href="#" data-action="home"><span class="brand-logo" id="brandLogo"></span><span data-product></span></a>
        <div class="nav__liquid" id="liquidNav"></div>
        <div class="nav__account" id="navAccount"></div>
      </div>
    </header>

    <section class="hero" id="hero">
      <div class="hero-blobs" id="heroBlobs" aria-hidden="true"></div>
      <div class="hero-inner">
        <h1 data-i18n-html="hero.title"></h1>
        <p class="hero-sub" data-i18n="hero.subtitle"></p>
      </div>
    </section>

    <section class="team" id="team">
      <div class="team__stage"><div class="team__avatar" id="teamAvatar"></div><div class="team__state" id="teamState"></div></div>
      <ol class="team__list" id="teamList"></ol>
    </section>

    <section class="section" id="how">
      <h2 data-i18n="how.title"></h2>
      <p class="lead" data-i18n="how.sub"></p>
      <div class="bento" id="bento"></div>
    </section>

    <section class="section" id="example">
      <h2 data-i18n="ex.title"></h2>
      <p class="lead" data-i18n="ex.sub"></p>
      <div class="play" id="play"></div>
    </section>

    <section class="section" id="coverage">
      <h2 data-i18n="cov.title"></h2>
      <p class="lead" data-i18n="cov.sub"></p>
      <div class="api" id="covList"></div>
    </section>

    <section class="section">
      <div class="pro" id="proCard"></div>
    </section>

    <section class="cta">
      <div class="cta__avatar" id="ctaAvatar"></div>
      <h2 data-i18n="cta.title"></h2>
      <p data-i18n="cta.sub"></p>
      <button class="btn btn-primary btn-lg" data-action="start" data-i18n="cta.start"></button>
    </section>

    <footer class="foot">
      <div class="nav__brand"><span class="brand-logo" id="brandLogo2"></span><span data-product></span></div>
      <div class="foot__mid" data-i18n="footer.note"></div>
      <div class="foot__right" id="footerMode"></div>
    </footer>
  </div>

  <!-- APP SHELL: sidebar + dashboard home (signed-in) -->
  <aside class="sb" id="sidebar" aria-label="Навигация"></aside>
  <div id="dash" class="screen"><div class="dh" id="dashHome"></div></div>
  <input type="file" id="fileInput" accept=".docx,.pdf,.txt,.md" hidden>
  <div class="drop-overlay" id="dropOverlay"><div><span data-icon="upload" data-size="22"></span><span data-i18n="hero.dropNow"></span></div></div>

  <!-- SCREEN 2: LOADING (thought chain) -->
  <div id="loading" class="screen">
    <div class="chain-wrap">
      <div class="chain-head">
        <div class="chain-avatars" id="chainAvatars"></div>
        <h3 id="chainTitle" data-i18n="chain.title"></h3>
        <p class="chain-file" id="chainFile"></p>
      </div>
      <ol class="chain" id="chain"></ol>
      <div class="chain-error" id="chainError" role="alert" hidden></div>
    </div>
  </div>

  <!-- SCREEN 3: CHAT -->
  <div id="chat" class="screen">
    <div class="chat-glow g1"></div><div class="chat-glow g2"></div><div class="chat-glow g3"></div>
    <div class="chat-layout">
      <div class="chat-main">
        <header class="chat-top" id="chatTop">
          <div class="chat-hero">
            <div class="chat-hero-blob" id="chatHeroBlob" aria-hidden="true"></div>
            <h1 class="chat-title" data-product></h1>
            <p class="chat-sub" data-i18n="chat.subtitle"></p>
          </div>
          <div class="chat-bar">
            <button class="icon-btn" data-action="sidebar" data-i18n-title="sb.toggle"><span data-icon="panel-left"></span></button>
            <div class="bar-title"><span class="brand-name" data-product></span><span class="bar-file" id="barFile"></span></div>
            <div class="bar-avatars" id="barAvatars"></div>
            <button class="score-pill" id="scorePill" data-action="cmd" data-cmd="score"><span class="sp-num">—</span><span class="sp-of">/100</span></button>
            <button class="icon-btn" data-action="trace" data-i18n-title="trace.title"><span data-icon="activity"></span></button>
            <button class="icon-btn" id="docToggle" data-action="toggle-doc" data-i18n-title="doc.title"><span data-icon="panel-right"></span></button>
          </div>
        </header>

        <main class="chat-stream" id="stream" aria-live="polite">
          <div class="stream-inner" id="streamInner"></div>
          <div class="typing" id="typing" hidden><span></span><span></span><span></span></div>
        </main>

        <div class="composer-wrap">
          <form class="composer" id="composer">
            <div id="msgInput" class="composer-input is-empty" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Сообщение" spellcheck="true"></div>
            <div class="composer-foot">
              <div class="composer-tools">
                <button type="button" class="icon-btn ghost" data-action="attach" data-i18n-title="chat.attach"><span data-icon="paperclip"></span></button>
                <button type="button" class="icon-btn ghost mention-btn" id="mentionBtn" data-i18n-title="chat.mention">@</button>
                <span class="composer-hint" data-i18n="chat.mentionHint"></span>
              </div>
              <input type="file" id="attachInput" accept=".docx,.pdf,.txt,.md" hidden>
              <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="Отправить"><span data-icon="arrow-up"></span></button>
            </div>
          </form>
          <div class="pills" id="pills"></div>
        </div>
      </div>

      <aside class="doc-panel" id="docPanel" aria-label="Документ">
        <div class="doc-grip" data-action="toggle-doc"></div>
        <div class="doc-head">
          <div class="doc-tabs">
            <button class="doc-tab is-active" data-tab="doc" data-i18n="doc.title"></button>
            <button class="doc-tab" data-tab="versions" data-i18n="doc.versions"></button>
          </div>
          <button class="icon-btn ghost" data-action="toggle-doc"><span data-icon="x"></span></button>
        </div>
        <div class="doc-body" id="docBody"></div>
        <div class="doc-versions" id="docVersions" hidden></div>
      </aside>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
