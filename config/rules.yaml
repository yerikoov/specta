# Rule dictionaries used by the code-based parts of the agents.
# Everything here is data: add words / keys without touching the code.

# ---------- Ambiguity agent: vague words ----------
# pattern: regex (case-insensitive) matched inside a sentence
# replace: text that replaces the matched word; {w} = the original word
vague_words:
  - id: fast
    pattern: "\\bбыстр(о|ый|ая|ое|ые|ым)\\b"
    severity: important
    why: "«Быстро» нельзя проверить: у разработчика и тестировщика будет разная планка."
    options:
      - {label: "Не более 1 с на операцию для 95% запросов", replace: "не более чем за 1 секунду для 95% запросов"}
      - {label: "Не более 2 с для 95% запросов", replace: "не более чем за 2 секунды для 95% запросов"}
      - {label: "Не более 3 с для 99% запросов", replace: "не более чем за 3 секунды для 99% запросов"}
  - id: convenient
    pattern: "\\bудобн\\w*"
    severity: important
    why: "Удобство субъективно — нужна измеримая оценка юзабилити."
    options:
      - {label: "SUS-оценка не ниже 75 баллов на 10 респондентах", replace: "{w} (оценка по шкале SUS — не ниже 75 баллов)"}
      - {label: "Основной сценарий — не более 3 экранов / 5 касаний", replace: "{w} (основной сценарий выполняется не более чем за 3 экрана и 5 касаний)"}
      - {label: "Соответствие гайдлайну дизайн-системы банка", replace: "{w} (соответствует гайдлайну дизайн-системы банка, ревью дизайнера)"}
  - id: intuitive
    pattern: "\\bинтуитивн\\w*(\\s+понятн\\w*)?"
    severity: minor
    why: "«Интуитивно» не проверяется тестом без критерия."
    options:
      - {label: "80% новых пользователей проходят сценарий без подсказок", replace: "понятным (80% новых пользователей проходят основной сценарий без подсказок)"}
      - {label: "Не более 1 обращения в поддержку на 1000 операций", replace: "понятным (не более 1 обращения в поддержку на 1000 операций)"}
  - id: if_possible
    pattern: "по возможности"
    severity: critical
    why: "«По возможности» делает требование необязательным — его не будет в релизе."
    options:
      - {label: "Обязательно в первом релизе", replace: "в первом релизе"}
      - {label: "Во втором релизе (через 3 месяца после запуска)", replace: "во втором релизе (через 3 месяца после запуска)"}
      - {label: "Убрать из скоупа проекта", replace: "(вне скоупа текущего проекта)"}
  - id: asap
    pattern: "в кратчайшие сроки|оперативно|своевременно"
    severity: important
    why: "Срок не указан — SLA нельзя проконтролировать."
    options:
      - {label: "Первый ответ — не более 2 минут", replace: "не позднее 2 минут с момента обращения"}
      - {label: "Не более 15 минут в рабочее время", replace: "не позднее 15 минут в рабочее время (09:00–21:00)"}
      - {label: "Не более 1 часа, 24/7", replace: "не позднее 1 часа, круглосуточно"}
  - id: many
    pattern: "больш(ое|ого) количеств\\w*(\\s+(пользовател|операц|запрос|клиент)\\w*)?"
    severity: important
    why: "Нагрузку нужно задать числом, иначе нагрузочный тест не с чем сравнить."
    options:
      - {label: "До 50 000 одновременных пользователей", replace: "до 50 000 одновременных пользователей"}
      - {label: "До 300 операций в секунду (пик)", replace: "пиковую нагрузку до 300 операций в секунду"}
      - {label: "До 1 млн операций в сутки", replace: "до 1 000 000 операций в сутки"}
  - id: simple
    pattern: "\\bпрост(ой|ым|ота|оты|отой|о)\\b"
    severity: minor
    why: "Простота — субъективная оценка без метрики."
    options:
      - {label: "Основной сценарий — за 30 секунд", replace: "{w} (основной сценарий занимает не более 30 секунд от входа в приложение)"}
      - {label: "Не более 3 полей для ввода", replace: "{w} (не более 3 полей для ввода)"}
  - id: etc
    pattern: "и т\\.\\s?д\\.?|и т\\.\\s?п\\.?|и прочее"
    severity: minor
    why: "Открытый перечень: непонятно, что входит в объём работ."
    options:
      - {label: "Закрыть перечень (только перечисленные пункты)", replace: ""}
  - id: when_needed
    pattern: "при необходимости|в случае необходимости"
    severity: minor
    why: "Не указано, кто и по какому критерию определяет «необходимость»."
    options:
      - {label: "По решению администратора системы", replace: "по решению администратора системы"}
      - {label: "Автоматически при превышении порога (задать порог)", replace: "автоматически при превышении заданного порога"}

# ---------- Testability agent: untestable markers ----------
# Matched per sentence; the option text REPLACES the whole sentence.
untestable:
  - id: reliable
    pattern: "надёжн|надежн|стабильн"
    severity: important
    topic: availability
    why: "«Надёжность» без метрики нельзя проверить на приёмке."
    options:
      - {label: "Доступность 99,9%, MTTR ≤ 30 мин", text: "Система должна обеспечивать доступность не ниже 99,9% в месяц; время восстановления после сбоя (MTTR) — не более 30 минут."}
      - {label: "Доступность 99,95%, резервный ЦОД", text: "Система должна обеспечивать доступность не ниже 99,95% в месяц с горячим резервированием в резервном ЦОД."}
      - {label: "Не более 1 инцидента P1 в квартал", text: "Система должна работать без инцидентов уровня P1 чаще 1 раза в квартал; доля неуспешных операций по вине системы — не более 0,1%."}
  - id: always
    pattern: "\\bвсегда\\b|круглосуточно и без перерывов|никогда не"
    severity: important
    topic: availability
    why: "«Всегда» = 100% доступности, этого не гарантирует ни одна система."
    options:
      - {label: "24/7, доступность 99,9% в месяц", text: "Сервис должен быть доступен 24/7 с доступностью не ниже 99,9% в месяц, без учёта согласованных регламентных работ."}
      - {label: "24/7, регламентные окна до 2 ч/мес ночью", text: "Сервис должен быть доступен 24/7; регламентные работы — не более 2 часов в месяц в интервале 02:00–05:00 с уведомлением клиентов за 24 часа."}
  - id: satisfied
    pattern: "доволен|довольн|удовлетвор"
    severity: important
    topic: satisfaction
    why: "Удовлетворённость не проверить без метрики и способа измерения."
    options:
      - {label: "CSAT ≥ 4,5 из 5 по опросу после операции", text: "Оценка удовлетворённости (CSAT) по опросу после завершения операции — не ниже 4,5 из 5 в течение первых 3 месяцев после запуска."}
      - {label: "NPS ≥ 40 через 3 месяца", text: "NPS сервиса через 3 месяца после запуска — не ниже 40."}
      - {label: "Доля успешных операций ≥ 98%", text: "Доля успешно завершённых операций от начатых — не ниже 98%."}
  - id: goal_no_metric
    pattern: "^(увеличить|сократить|повысить|снизить|улучшить|уменьшить)\\b"
    severity: important
    topic: goals
    only_without_digits: true
    why: "Цель без числа и срока нельзя проверить после запуска."
    options:
      - {label: "+15% к целевому показателю за 6 месяцев", text: "{s} на 15% в течение 6 месяцев после запуска (база — показатель на дату запуска)."}
      - {label: "+30% за 12 месяцев", text: "{s} на 30% в течение 12 месяцев после запуска."}
      - {label: "Зафиксировать базу и цель после пилота", text: "{s}; базовое значение и целевой показатель утверждаются по итогам пилота (до 31.03.2027)."}
  - id: error_generic
    pattern: "в случае ошибки|при ошибке"
    severity: minor
    topic: errors
    only_without_digits: true
    why: "Не указано, какие ошибки и какие сообщения — тестировщик не сможет написать кейсы."
    options:
      - {label: "Перечень кодов ошибок и текстов — в приложении", text: "При ошибке система показывает сообщение по справочнику кодов ошибок (приложение Б): недостаточно средств, превышен лимит, неверные данные, таймаут внешней системы, неверный код подтверждения."}
      - {label: "Только 5 типовых ошибок с текстами", text: "Система обрабатывает 5 типов ошибок (недостаточно средств, превышен лимит, неверные данные, неверный код, технический сбой) и для каждой показывает отдельное сообщение и действие для клиента."}

# ---------- Contradictions agent: facts table ----------
# subject: regex that marks a sentence as talking about this fact
# kind:    money | percent | duration | date | count
fact_keys:
  - id: single_limit
    name: "Лимит на одну операцию"
    subject: "одн(ого|ой|у) (перевод|операци)\\w*|разов\\w* (лимит|сумм)"
    kind: money
    severity: critical
  - id: daily_limit
    name: "Суточный лимит"
    subject: "суточн\\w* лимит|лимит\\w*.{0,25}(в сутки|в день)|дневн\\w* лимит"
    kind: money
    severity: critical
    extra_option:
      label: "Разные лимиты: {min} — до полной идентификации, {max} — после"
      text: "{min} для клиентов без полной идентификации, {max} — для клиентов, прошедших полную идентификацию"
  - id: monthly_limit
    name: "Месячный лимит"
    subject: "лимит\\w*.{0,25}(в месяц)|месячн\\w* лимит"
    kind: money
    severity: critical
  - id: fee
    name: "Комиссия"
    subject: "комисси"
    kind: percent
    severity: critical
  - id: otp_ttl
    name: "Срок действия кода подтверждения"
    subject: "(код|otp)\\w*.{0,25}(действ|жизн)|(действ|жизн)\\w*.{0,25}(код|otp)"
    kind: duration
    severity: important
  - id: launch_date
    name: "Дата промышленного запуска"
    subject: "промышленн\\w* запуск|запуск в промышленн|go-live|дата запуска"
    kind: date
    severity: important
  - id: retention
    name: "Срок хранения данных"
    subject: "срок\\w* хранени|хран\\w*.{0,20}(не менее|в течение)"
    kind: duration
    severity: important
  - id: attempts
    name: "Количество попыток ввода"
    subject: "попыт"
    kind: count
    severity: minor
