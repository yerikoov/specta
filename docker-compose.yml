# docker compose up --build        — the website on http://localhost:8000 (keys from .env)
# CLI in the same image:
#   docker compose run --rm -v "$PWD/docs:/docs" specta python -m app.cli check /docs/requirements.pdf /docs/report.md --no-anim
services:
  specta:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    volumes: ["specta-data:/app/data"]
    restart: unless-stopped

volumes:
  specta-data:
